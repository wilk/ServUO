# Character creation options.

# If true, a new character can only be Human. The Classic client will not
# show the Elf and Gargoyle buttons. The server also ignores any other
# race the client sends, no matter what the client shows.
HumanOnly=True

# The city every new character starts in, no matter what city the client
# sends. Must match the City name of an entry in one of the starting
# city lists in Scripts/Accounting/AccountHandler.cs. Leave empty to let
# the player pick from the normal city list.
ForceStartingCity=Moonglow

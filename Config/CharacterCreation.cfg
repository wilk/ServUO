# Character creation options.
#
# Both options are off in the code. This file turns them on. If you delete
# this file, or if you leave a value empty, the shard goes back to the stock
# ServUO behaviour.
#
# The server reads this file once, at start. Restart the server after a change.

# If true, a new character can only be Human. The Classic client does not
# show the Elf and Gargoyle buttons. The server also ignores any other race
# the client sends, no matter what the client shows.
HumanOnly=True

# The city every new character starts in, no matter what city the client
# sends. The name must match the City name of an entry in one of the
# starting city lists in Scripts/Accounting/AccountHandler.cs. The match
# ignores upper and lower case. Leave empty to let the player pick from the
# normal city list.
#
# Siege shards use a short city list that holds Britain and Royal City only.
# On such a shard a name outside that list does nothing, and the server
# writes a warning on the console.
ForceStartingCity=Moonglow

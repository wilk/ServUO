# Character creation options.
#
# Both options are off in the code. This file turns them on. If you delete
# this file, or if you leave a value empty, the shard goes back to the stock
# ServUO behaviour.
#
# The client keeps its normal screens. The player can pick any race and any
# city. The server then overrides both. Nothing here changes what the client
# shows.
#
# The server reads this file once, at start. Restart the server after a change.

# If true, every new character is Human. The server ignores the race the
# client sends.
HumanOnly=True

# The point every new character starts on. The server ignores the city the
# client sends. Write it as X,Y or as X,Y,Z. With no Z, the server reads the
# height of the map at that point. Leave empty to keep the city the player
# picked.
ForceStartingLocation=4454, 1082

# The facet of the point above. Use a map name, such as Trammel, Felucca,
# Ilshenar, Malas, Tokuno or TerMur. Leave empty to keep the city the player
# picked.
ForceStartingMap=Trammel

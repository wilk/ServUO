# Configuration file for spell casting behaviour

# If true, a caster moves, runs and rides during a spell cast. The cast does
# not stop, and the client does not freeze the figure during the cast.
MoveWhileCasting=true

# If true, a spell that needs a target asks for the target before the cast
# starts. The player picks the target, then the cast starts, then the spell
# hits the picked target.
TargetBeforeCast=true

# If true, a player casts Magery, Necromancy, Mysticism or Spellweaving only
# with the matching spellbook in hand. A book in the backpack is not enough.
# Chivalry, Bushido, Ninjitsu and the Mastery abilities are not affected. A
# scroll and a wand still cast with no book in hand.
RequireEquippedSpellbook=false

# If true, the caster's weapon moves to the backpack at the start of the cast.
# If false, the weapon stays in hand during and after the cast.
ClearHandsOnCast=false

# If true, the caster can swing an equipped weapon while a spell casts.
SwingWhileCasting=true

# The multiplier applied to spell damage. A value of 1.0 leaves spell damage
# unchanged.
DamageScalar=1.0

# The multiplier applied to the spell damage a player deals to a wild
# creature (a BaseCreature that is neither tamed nor summoned). A value of
# 1.0 leaves the damage unchanged.
PveDamageScalar=2.0

# The multiplier applied to the spell damage a wild creature (a BaseCreature
# that is neither tamed nor summoned) deals to a player. A value of 1.0
# leaves the damage unchanged.
MonsterDamageScalar=0.5
